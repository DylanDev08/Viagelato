name: Viagelato mobile browser check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/mobile_browser_smoke.py'
      - '.github/workflows/mobile-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viagelato-mobile-browser-main
  cancel-in-progress: true

jobs:
  mobile-browser:
    name: Real Chromium viewport checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Smoke test public store on mobile viewports
        env:
          BASE_URL: https://viagelato.vercel.app
        run: python scripts/mobile_browser_smoke.py
      - name: Keep public screenshots and viewport report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viagelato-mobile-browser-report
          path: .mobile-smoke/
          if-no-files-found: warn
          retention-days: 7
